<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Hanka The Fox Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071009;
      --wood: #5a3a1f;
      --wood-light: #8a5a30;
      --accent: #f2a541;
      --text: #f3ecd8;
      --title: "Cinzel", "Georgia", serif;
      --body: "Nunito", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      overflow: hidden;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#game {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #071009;
      touch-action: none;
    }

    /* ---------- Start screen ---------- */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 120%, rgba(30, 80, 45, 0.55), transparent 60%),
        radial-gradient(ellipse at center, rgba(12, 40, 24, 0.9), rgba(3, 8, 5, 0.98));
      z-index: 10;
      overflow: hidden;
    }
    #overlay.hidden { display: none; }

    /* Silhouettes of trees along the bottom */
    #overlay::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 45%;
      background:
        linear-gradient(to top, rgba(0,0,0,0.6), transparent),
        repeating-linear-gradient(90deg, transparent 0 60px, rgba(5,25,14,0.9) 60px 68px, transparent 68px 140px);
      mask-image: linear-gradient(to top, #000 60%, transparent);
      -webkit-mask-image: linear-gradient(to top, #000 60%, transparent);
      pointer-events: none;
    }

    /* Fox eyes glowing in the dark */
    .eyes {
      position: absolute;
      display: flex;
      gap: 14px;
      animation: blink var(--dur, 5s) infinite;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255, 200, 60, 0.8));
    }
    .eyes i {
      width: 10px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6c2 0%, #ffcc44 50%, #d67a12 100%);
      display: block;
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); opacity: 0.95; }
      90%, 94% { transform: scaleY(0.1); opacity: 0.5; }
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, #6a4526 0%, #4c3018 55%, #3c2410 100%);
      border: 3px solid #2b1708;
      outline: 2px solid #9c6a3a;
      outline-offset: -8px;
      border-radius: 18px;
      padding: 30px 38px 26px;
      width: min(94vw, 500px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 0 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .card::before, .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(0,0,0,0.06) 9px 11px);
    }
    .card h1 {
      margin: 0 0 2px;
      font-family: var(--title);
      font-weight: 900;
      font-size: 2.1rem;
      line-height: 1.1;
      color: var(--accent);
      letter-spacing: 1px;
      text-shadow: 0 3px 0 #5a2f08, 0 6px 14px rgba(0,0,0,0.7);
    }
    .card .sub {
      margin: 6px 0 18px;
      opacity: 0.85;
      font-size: 0.95rem;
      font-style: italic;
    }
    .row { display: flex; gap: 16px; align-items: stretch; }
    .row > * { min-width: 0; }
    #preview {
      width: 120px;
      height: 130px;
      border-radius: 12px;
      background: radial-gradient(circle at 50% 40%, #1f4a2e, #0b1d12 80%);
      border: 2px solid #2b1708;
      display: block;
      flex: none;
    }
    .fields { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .card input {
      width: 100%;
      font-family: var(--body);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #2b1708;
      background: #f3ecd8;
      color: #2b1708;
      outline: none;
      text-align: center;
    }
    .card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242,165,65,0.35); }
    .outfit {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.9rem;
    }
    .outfit button {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid #2b1708;
      background: var(--accent);
      color: #2b1708;
      font-weight: 900;
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
    }
    .outfit button:hover { background: #ffbd5c; }
    #outfitName { font-weight: 800; }
    .card button.play {
      width: 100%;
      margin-top: 16px;
      font-family: var(--title);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 2px;
      padding: 13px;
      border: 3px solid #2b1708;
      border-radius: 10px;
      background: linear-gradient(180deg, #ffc35c, #e08b1f);
      color: #2b1708;
      cursor: pointer;
      box-shadow: 0 4px 0 #7a4410, 0 8px 18px rgba(0,0,0,0.5);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .card button.play:hover { background: linear-gradient(180deg, #ffd27f, #f09a2a); }
    .card button.play:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a4410; }
    .controls {
      margin-top: 16px;
      font-size: 0.82rem;
      opacity: 0.9;
      text-align: left;
      line-height: 1.7;
      background: rgba(0,0,0,0.22);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .controls kbd {
      background: #f3ecd8;
      color: #2b1708;
      border-radius: 4px;
      padding: 0 6px;
      font-family: var(--body);
      font-weight: 800;
      font-size: 0.78rem;
      box-shadow: 0 2px 0 #9c6a3a;
    }
    #status { margin-top: 8px; font-size: 0.85rem; color: #ffb3a7; min-height: 1.2em; }

    /* ---------- Touch controls ---------- */
    #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
    body.touch #touch { display: block; }
    .tbtn {
      position: absolute;
      bottom: 4vh;
      width: 66px; height: 66px;
      border-radius: 50%;
      background: rgba(90, 58, 31, 0.55);
      border: 3px solid rgba(242, 165, 65, 0.7);
      color: #fff;
      font-size: 1.6rem;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
      user-select: none; -webkit-user-select: none;
    }
    .tbtn.active { background: rgba(242, 165, 65, 0.7); }
    #tLeft { left: 4vw; }
    #tRight { left: calc(4vw + 82px); }
    #tDown { right: calc(4vw + 164px); }
    #tJump { right: calc(4vw + 82px); }
    #tShoot { right: 4vw; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

  <div id="touch">
    <div class="tbtn" id="tLeft" data-key="left">◀</div>
    <div class="tbtn" id="tRight" data-key="right">▶</div>
    <div class="tbtn" id="tDown" data-key="down">⤓</div>
    <div class="tbtn" id="tJump" data-key="jump">⤒</div>
    <div class="tbtn" id="tShoot" data-key="shoot">✦</div>
  </div>

  <div id="overlay">
    <div class="eyes" style="left:8%;top:22%;--dur:6s"><i></i><i></i></div>
    <div class="eyes" style="left:14%;top:70%;--dur:4.5s"><i></i><i></i></div>
    <div class="eyes" style="left:84%;top:30%;--dur:7s"><i></i><i></i></div>
    <div class="eyes" style="left:90%;top:64%;--dur:5.5s"><i></i><i></i></div>
    <div class="eyes" style="left:4%;top:48%;--dur:8s"><i></i><i></i></div>
    <div class="eyes" style="left:76%;top:82%;--dur:6.5s"><i></i><i></i></div>

    <div class="card">
      <h1>Hanka<br />The Fox Hunter</h1>
      <p class="sub">Les je plný lišek. Nenech se sežrat!</p>

      <div class="row">
        <canvas id="preview" width="120" height="130"></canvas>
        <div class="fields">
          <input id="name" maxlength="16" placeholder="Tvoje jméno" autocomplete="off" />
          <div class="outfit">
            <button id="outfitPrev" type="button" aria-label="Předchozí outfit">‹</button>
            <span id="outfitName">Automaticky</span>
            <button id="outfitNext" type="button" aria-label="Další outfit">›</button>
          </div>
        </div>
      </div>

      <button id="play" class="play">Do lesa!</button>
      <div id="status"></div>

      <div class="controls">
        <kbd>A</kbd>/<kbd>D</kbd> nebo <kbd>←</kbd>/<kbd>→</kbd> pohyb &nbsp;·&nbsp;
        <kbd>W</kbd>/<kbd>↑</kbd>/<kbd>Space</kbd> skok<br />
        <kbd>Ctrl</kbd>, <kbd>F</kbd> nebo <kbd>X</kbd> střelba<br />
        Liška <b>+10</b>, mega liška <b>+50</b>. Kdo umře, poletuje jako duch
        (<kbd>W</kbd>/<kbd>S</kbd>). Když padnou všichni, začne nové kolo.
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
